[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reze"
version = "1.1.0"
description = "Advanced Telegram Userbot & Web Control Panel by UnchartedAli (@yamods)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "UnchartedAli" }
]
license = { text = "MIT" }
keywords = ["telegram", "userbot", "telethon", "mtproto", "bot", "render", "railway", "koyeb"]
dependencies = [
    "telethon>=1.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.0",
    "aiofiles>=23.0.0",
    "python-socks[asyncio]>=2.4.0",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://t.me/yamods"
Source = "https://t.me/yamods"

[tool.ruff]
line-length = 100
target-version = "py311"
