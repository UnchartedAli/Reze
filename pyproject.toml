[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reze"
version = "2.0.0"
description = "REZE 2.0 - Personal Telegram OS: Telethon userbot, media studio, AI gateway and web panel"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "UnchartedAli" }
]
license = { text = "MIT" }
keywords = ["telegram", "userbot", "telethon", "mtproto", "automation", "media", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "telethon>=1.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-socks[asyncio]>=2.4.0",
    "tzdata>=2024.1",
    # Image and static sticker processing. FFmpeg stays a system dependency.
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# AI providers are reached over their official HTTP APIs with the standard
# library, so no provider SDK is required.
dev = ["ruff>=0.5.0"]

[project.scripts]
reze = "reze.app:cli"

[project.urls]
Homepage = "https://github.com/UnchartedAli/Reze"
Source = "https://github.com/UnchartedAli/Reze"
Channel = "https://t.me/yamods"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.setuptools]
packages = ["reze", "reze.ai", "reze.automation", "reze.commands", "reze.core", "reze.media", "reze.modules", "reze.plugins", "reze.productivity", "reze.ui", "reze.web"]
