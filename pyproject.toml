[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reze"
version = "3.0.0"
description = "REZE 3.0 - Your Personal Digital Operating System: Telegram userbot, personal OS, AI tools and web panel"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "UnchartedAli" }
]
license = { text = "MIT" }
keywords = [
    "telegram",
    "userbot",
    "telethon",
    "mtproto",
    "automation",
    "media",
    "ai",
    "personal-os",
    "crm",
    "vault",
    "localization",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Office/Business :: Personal Information Manager",
]
dependencies = [
    "telethon>=1.34.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-socks[asyncio]>=2.4.0",
    "tzdata>=2024.1",
    # AES-256-GCM encryption for Digital Vault entries and stored secrets.
    # Required for the vault; the rest of the database stays plaintext SQLite.
    "cryptography>=42.0.0",
    # Image and static sticker processing. FFmpeg stays a system dependency.
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
# AI providers are reached over their official HTTP APIs with the standard
# library, so no provider SDK is required.
dev = ["ruff>=0.5.0"]

[project.scripts]
reze = "reze.app:cli"
reze-install = "reze.installer:main"

[project.urls]
Homepage = "https://github.com/UnchartedAli/Reze"
Source = "https://github.com/UnchartedAli/Reze"
Channel = "https://t.me/yamods"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.setuptools]
packages = [
    "reze",
    "reze.ai",
    "reze.ai.tools",
    "reze.automation",
    "reze.capture",
    "reze.commands",
    "reze.core",
    "reze.games",
    "reze.localization",
    "reze.media",
    "reze.migrations",
    "reze.modules",
    "reze.personal",
    "reze.plugins",
    "reze.productivity",
    "reze.search",
    "reze.security",
    "reze.storage",
    "reze.storage.backups",
    "reze.storage.vault",
    "reze.ui",
    "reze.web",
]

[tool.setuptools.package-data]
"reze.localization" = ["locales/*.json"]
