# ========================================================
#  Reze Web Panel — Nginx reverse proxy with HTTPS
#  Developer: UnchartedAli  ·  Channel: @yamods
# ========================================================
#  Replace reze.yourdomain.com with your real domain, then:
#    sudo certbot --nginx -d reze.yourdomain.com
# ========================================================

server {
    listen 80;
    server_name reze.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name reze.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/reze.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reze.yourdomain.com/privkey.pem;

    # Health endpoint stays public for external monitors.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
