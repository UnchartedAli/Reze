
services:
  reze:
    build:
      context: .
      dockerfile: Dockerfile
    image: reze-userbot:latest
    restart: unless-stopped

    environment:
      REZE_WEB_HOST: 0.0.0.0
      REZE_WEB_PORT: 8080
      REZE_DATA_DIR: /app/data

    ports:
      - "8080:8080"

    volumes:
      - type: volume
        source: reze_data
        target: /app/data

    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  reze_data:
    {}
